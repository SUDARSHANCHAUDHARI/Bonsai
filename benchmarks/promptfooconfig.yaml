description: Bonsai vs no-skill — lines of code on everyday tasks

prompts:
  - file://arms/baseline.js
  - file://arms/bonsai.js

providers:
  - anthropic:messages:claude-haiku-4-5-20251001
  - anthropic:messages:claude-sonnet-4-6

tests:
  - vars: { task: "Write a Python email validator." }
  - vars: { task: "Write a JavaScript debounce function." }
  - vars: { task: "Sum a numeric column in a CSV in Python." }
  - vars: { task: "Write a React countdown timer component." }
  - vars: { task: "Write a FastAPI rate limiter." }

defaultTest:
  assert:
    # Measurement: records lines of code (always passes).
    - type: javascript
      value: file://loc.js
    # Gate: fails the row if the generated code is broken.
    - type: javascript
      value: file://correctness.js
